schema: spec-driven

# Project context
context: |
  Producto: "Quiniela NFL" — plataforma web (no app nativa) para llevar el seguimiento
  de predicciones deportivas de NFL entre grupos privados (familia, amigos, compañeros).
  NO procesa pagos ni reparte premios en efectivo dentro de la plataforma — es una
  herramienta de conteo, clasificación y estadísticas. Cualquier acuerdo económico se
  resuelve fuera de la plataforma. No debe agregarse ninguna funcionalidad de pago,
  cobro de cuotas ni premios en efectivo sin asesoría legal previa.

  Tech stack:
    - Backend/DB/Auth: Supabase (Postgres, Supabase Auth, Row Level Security,
      Edge Functions cuando se necesite lógica de servidor).
    - Frontend: React (aplicación web responsiva, prioridad mobile-first ya que la
      mayoría de usuarios entrarán desde celular).
    - Autenticación: login simple vía Supabase Auth (correo o proveedores OAuth como
      Google/Apple).

  Dominio — 3 módulos de juego, todos organizados por "grupos privados":
    1. Quiniela Semanal (opcional, opt-in con aprobación del admin del grupo):
       predicción de ganador (incluye empate) por partido, desde pretemporada hasta
       el arranque de playoffs. Un solo ganador (o empate repartido) por temporada.
    2. Survivor: un equipo por semana sin repetir en la temporada, 2 vidas extra
       gratuitas por usuario, 3 lugares premiados con reglas de desempate por
       duración con vida original.
    3. Playoffs: predicción por rango de diferencia de puntos (3 opciones por
       partido), reemplaza a la Quiniela Semanal en cuanto arrancan playoffs,
       3 lugares premiados por grupo.

  Funcionalidades transversales: grupos privados (creación/invitación por
  link o código, administración de miembros), perfil de usuario con
  historial/estadísticas, notificaciones opcionales de recordatorio, carga de
  resultados de partidos (manual por admin y/o integración con API deportiva
  a futuro).

  Convenciones:
    - Idioma del producto (UI, specs, nombres de dominio): español.
    - Nunca usar textos o campos relacionados con "pagar", "cobrar" o "premio en
      efectivo" — feature explícitamente fuera de alcance.
    - Commits en español, estilo conventional commits (feat:, fix:, docs:, etc.).

  Fuente de verdad de requerimientos funcionales: doc/requrimientov1.md

